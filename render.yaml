services:
  - type: web
    name: smart-water-monitor
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: smart-water-monitor
          property: host
      - key: MONGO_URI
        sync: false
      - key: CHANNEL_ID
        value: "3445219"
      - key: READ_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
  - type: worker
    name: water-loss-ml-pipeline
    runtime: python
    rootDir: ai-smart-water-ml
    buildCommand: pip install -r requirements.txt
    startCommand: python src/pipeline/prediction_pipeline.py
    envVars:
      - key: MONGO_URI
        fromService:
          type: web
          name: smart-water-monitor
          envVarKey: MONGO_URI
      - key: MONGO_DATABASE
        value: water_loss_detection
      - key: MONGO_COLLECTION
        value: sensors
