services:
  # ── Single web service: Node.js backend + Python ML in one process ────────
  - type: web
    name: smart-water-monitor
    runtime: node
    rootDir: backend
    # 1. Install backend Node deps
    # 2. Install frontend deps and build the React SPA → frontend/dist
    # 3. Install Python ML deps (used by the embedded ML runner)
    buildCommand: >
      npm install &&
      cd ../frontend && npm install && npm run build &&
      cd .. && pip install -r ai-smart-water-ml/requirements.txt
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets this automatically — used by keepAlive and email links
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: smart-water-monitor
          property: host
      # CORS: restrict to the deployed URL in production
      - key: WEB_ORIGINS
        fromService:
          type: web
          name: smart-water-monitor
          property: host
      # Python executable on Render (Linux)
      - key: PYTHON_BIN
        value: python3
      # ML runner interval (ms) — 15 s matches ThingSpeak poll rate
      - key: ML_RUN_INTERVAL_MS
        value: "15000"
      # ML pipeline thresholds (safe defaults)
      - key: MONGO_DATABASE
        value: water_loss_detection
      - key: MONGO_COLLECTION
        value: sensors
      - key: PREDICTION_INTERVAL_SECONDS
        value: "10"
      - key: SEVERITY_LOW_MAX
        value: "0.50"
      - key: SEVERITY_MEDIUM_MAX
        value: "0.80"
      - key: TURBIDITY_GOOD_MAX
        value: "30"
      - key: TURBIDITY_MODERATE_MAX
        value: "60"
      - key: RECOVERY_REQUIRED_READINGS
        value: "3"
      - key: RECOVERY_MAX_AGE_MINUTES
        value: "5"
      # ── Secrets: set these in the Render dashboard ─────────────────────
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: READ_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
