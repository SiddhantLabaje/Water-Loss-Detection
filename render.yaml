  - type: worker
    name: water-loss-ml-pipeline
    runtime: python
    rootDir: ai-smart-water-ml
    buildCommand: pip install -r requirements.txt
    startCommand: python src/pipeline/prediction_pipeline.py
    envVars:
      - key: MONGO_URI
        fromService:
          type: web
          name: smart-water-monitor
          envVarKey: MONGO_URI
