services:
  # ── Single web service: Node.js + React frontend + Python ML ─────────────
  - type: web
    name: smart-water-monitor
    runtime: node
    # rootDir is NOT set — build runs from the repo root
    # Build steps (run in sequence from repo root):
    #   1. Install backend deps
    #   2. Install frontend deps and build React SPA  →  frontend/dist/
    #   3. Install Python ML deps
    #   4. Run ML worker once to process any sensor readings backlog before server starts
    buildCommand: "cd backend && npm install && cd ../frontend && npm install && npm run build && cd .. && pip install -r ai-smart-water-ml/requirements.txt && python3 ai-smart-water-ml/ml_worker.py"
    startCommand: "cd backend && node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: smart-water-monitor
          property: host
      - key: WEB_ORIGINS
        fromService:
          type: web
          name: smart-water-monitor
          property: host
      - key: PYTHON_BIN
        value: python3
      - key: ML_RUN_INTERVAL_MS
        value: "15000"
      - key: MONGO_DATABASE
        value: water_loss_detection
      - key: MONGO_COLLECTION
        value: sensors
      - key: PREDICTION_INTERVAL_SECONDS
        value: "10"
      - key: SEVERITY_LOW_MAX
        value: "0.50"
      - key: SEVERITY_MEDIUM_MAX
        value: "0.80"
      - key: TURBIDITY_GOOD_MAX
        value: "30"
      - key: TURBIDITY_MODERATE_MAX
        value: "60"
      - key: RECOVERY_REQUIRED_READINGS
        value: "3"
      - key: RECOVERY_MAX_AGE_MINUTES
        value: "5"
      # ── Set these in the Render dashboard — never commit secrets ──────────
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: READ_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
