<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password reset — Smart Water Monitor</title><link rel="stylesheet" href="/shared.css">
  <style>.box{width:min(480px,calc(100% - 32px));margin:10vh auto;padding:28px;background:#fff;border:1px solid var(--border);border-radius:10px}.box h1{margin-bottom:8px}.box p{color:var(--muted);margin-bottom:16px}form{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:600}input{padding:10px;border:1px solid var(--border-2);border-radius:var(--radius);font:inherit}.msg{min-height:24px;margin-top:12px}</style>
</head>
<body><main class="box"><h1>Password reset</h1><p>Request a single-use reset link or enter a new password using the link from your email.</p>
<form id="request-form"><label>Email<input name="email" type="email" required maxlength="254"></label><button class="btn" type="submit">Request reset link</button></form>
<form id="reset-form" hidden><label>New password (12+ characters)<input name="password" type="password" minlength="12" maxlength="128" required></label><button class="btn" type="submit">Reset password</button></form>
<div id="message" class="msg" role="status" aria-live="polite"></div><a href="login.html">Back to sign in</a></main>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const requestForm = document.getElementById('request-form');
  const resetForm = document.getElementById('reset-form');
  const message = document.getElementById('message');
  resetForm.hidden = !token;
  requestForm.hidden = Boolean(token);
  requestForm.addEventListener('submit', async event => {
    event.preventDefault();
    await submit('/api/auth/forgot-password', Object.fromEntries(new FormData(requestForm)), requestForm);
  });
  resetForm.addEventListener('submit', async event => {
    event.preventDefault();
    await submit('/api/auth/reset-password', { token, ...Object.fromEntries(new FormData(resetForm)) }, resetForm);
  });
  async function submit(url, body, form) {
    const button = form.querySelector('button');
    button.disabled = true;
    message.textContent = 'Please wait…';
    try {
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'Request failed.');
      message.textContent = result.message;
      message.style.color = 'var(--success)';
    } catch (error) {
      message.textContent = error.message;
      message.style.color = 'var(--danger)';
    } finally { button.disabled = false; }
  }
</script></body></html>
